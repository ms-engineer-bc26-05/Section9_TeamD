<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>具体的な内容の入力画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.box{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.5}.btn{fill:#D98978}.tag{fill:#F2DDD6}</style>
  <text class="t" x="26" y="54" font-size="21">‹</text>
  <text class="m" x="344" y="54" text-anchor="end" font-size="12">2 / 4</text>
  <rect x="26" y="72" width="338" height="5" rx="3" fill="#E5DED7"/>
  <rect x="26" y="72" width="169" height="5" rx="3" fill="#D98978"/>
  <rect class="tag" x="26" y="108" width="190" height="34" rx="17"/>
  <text class="t" x="121" y="130" text-anchor="middle" font-size="11">会話・連絡・愛情表現</text>
  <text class="t" x="26" y="190" font-size="22" font-weight="700">どんなことが</text>
  <text class="t" x="26" y="220" font-size="22" font-weight="700">気になっていますか？</text>
  <text class="m" x="26" y="251" font-size="12">まとまっていなくても大丈夫です</text>
  <rect class="box" x="26" y="281" width="338" height="272" rx="18"/>
  <text class="m" x="44" y="317" font-size="13">例：話をしているときにスマホを見ていて、</text>
  <text class="m" x="44" y="340" font-size="13">聞いてもらえていない気がしました…</text>
  <text class="m" x="344" y="533" text-anchor="end" font-size="11">0 / 500</text>
  <rect x="26" y="579" width="338" height="68" rx="14" fill="#E3E7D8"/>
  <text class="t" x="44" y="606" font-size="12" font-weight="700">書かないでほしい情報</text>
  <text class="m" x="44" y="629" font-size="11">実名・住所・電話番号・メールアドレスなど</text>
  <rect class="btn" x="26" y="690" width="338" height="58" rx="16"/>
  <text x="195" y="726" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="700">対話を始める</text>
</svg>
