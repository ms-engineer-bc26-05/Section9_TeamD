<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>出来事を対話で整理する画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.bubble{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.5}.user{fill:#F2DDD6}.input{fill:#FFFFFF;stroke:#D8D0C8;stroke-width:1.5}</style>
  <text class="t" x="26" y="50" font-size="21">‹</text>
  <text class="t" x="195" y="51" text-anchor="middle" font-size="16" font-weight="700">気持ちを整理する</text>
  <text class="m" x="355" y="51" text-anchor="end" font-size="11">中断</text>
  <g font-family="sans-serif" font-size="10" fill="#81766F">
    <circle cx="59" cy="94" r="8" fill="#D98978"/><text x="59" y="120" text-anchor="middle">出来事</text>
    <line x1="67" y1="94" x2="123" y2="94" stroke="#D8D0C8" stroke-width="3"/>
    <circle cx="131" cy="94" r="8" fill="#E5DED7"/><text x="131" y="120" text-anchor="middle">感情</text>
    <line x1="139" y1="94" x2="195" y2="94" stroke="#D8D0C8" stroke-width="3"/>
    <circle cx="203" cy="94" r="8" fill="#E5DED7"/><text x="203" y="120" text-anchor="middle">本音</text>
    <line x1="211" y1="94" x2="267" y2="94" stroke="#D8D0C8" stroke-width="3"/>
    <circle cx="275" cy="94" r="8" fill="#E5DED7"/><text x="275" y="120" text-anchor="middle">望み</text>
  </g>
  <text class="m" x="355" y="142" text-anchor="end" font-size="10">出来事の確認 2 / 3</text>
  <rect class="bubble" x="26" y="154" width="302" height="122" rx="18"/>
  <text class="t" x="44" y="185" font-size="13">話しているときに、相手がスマホを</text>
  <text class="t" x="44" y="208" font-size="13">見ていたことが気になったのですね。</text>
  <text class="t" x="44" y="242" font-size="13">この理解で合っていますか？</text>
  <rect class="user" x="26" y="297" width="160" height="52" rx="16"/>
  <text class="t" x="106" y="329" text-anchor="middle" font-size="12">はい、合っています</text>
  <rect class="bubble" x="204" y="297" width="160" height="52" rx="16"/>
  <text class="t" x="284" y="329" text-anchor="middle" font-size="12">少し違います</text>
  <text class="m" x="26" y="378" font-size="11">訂正後はAIの理解をもう一度確認します</text>
  <text class="m" x="26" y="399" font-size="11">訂正・再確認は質問とは別に最大2回です</text>
  <rect class="bubble" x="26" y="421" width="302" height="128" rx="18"/>
  <text class="t" x="44" y="453" font-size="13">そのとき、相手に話していたのは</text>
  <text class="t" x="44" y="476" font-size="13">どのような内容でしたか？</text>
  <text class="m" x="44" y="517" font-size="11">覚えている範囲で大丈夫です</text>
  <text class="m" x="44" y="538" font-size="11">追加質問は最大3問までです</text>
  <text class="m" x="26" y="586" font-size="11">2回の訂正後も違う場合は、次の画面で</text>
  <text class="m" x="26" y="607" font-size="11">要約を直接編集できます</text>
  <rect class="input" x="20" y="690" width="350" height="66" rx="20"/>
  <text class="m" x="40" y="730" font-size="13">ここに入力してください</text>
  <circle cx="337" cy="723" r="20" fill="#D98978"/>
  <path d="M329 723h16M339 716l7 7-7 7" fill="none" stroke="#FFF" stroke-width="2"/>
  <text class="m" x="195" y="793" text-anchor="middle" font-size="10">専門窓口・利用上の注意</text>
</svg>
