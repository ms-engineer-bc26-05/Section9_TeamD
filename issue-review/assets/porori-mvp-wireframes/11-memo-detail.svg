<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>保存メモ詳細画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.card{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.3}.label1{fill:#F2DDD6}.label2{fill:#E3E7D8}.danger{fill:#FFFDFC;stroke:#C96F60;stroke-width:1.5}</style>
  <text class="t" x="26" y="50" font-size="21">‹</text>
  <text class="t" x="195" y="51" text-anchor="middle" font-size="17" font-weight="700">整理メモ</text>
  <text class="m" x="340" y="51" text-anchor="end" font-size="11">2026.09.19</text>
  <rect x="28" y="82" width="90" height="30" rx="15" fill="#F3E8DD"/>
  <text class="t" x="73" y="102" text-anchor="middle" font-size="11">今は保留</text>
  <rect class="card" x="28" y="128" width="334" height="78" rx="15"/>
  <rect class="label1" x="28" y="128" width="66" height="78" rx="15"/>
  <text class="t" x="61" y="170" text-anchor="middle" font-size="11" font-weight="700">出来事</text>
  <text class="t" x="110" y="157" font-size="11">話しているとき、相手が</text><text class="t" x="110" y="178" font-size="11">スマホを見ていた</text>
  <rect class="card" x="28" y="216" width="334" height="78" rx="15"/>
  <rect class="label2" x="28" y="216" width="66" height="78" rx="15"/>
  <text class="t" x="61" y="258" text-anchor="middle" font-size="11" font-weight="700">感情</text>
  <text class="t" x="110" y="245" font-size="11">寂しい、大切にされて</text><text class="t" x="110" y="266" font-size="11">いないように感じた</text>
  <rect class="card" x="28" y="304" width="334" height="78" rx="15"/>
  <rect class="label1" x="28" y="304" width="66" height="78" rx="15"/>
  <text class="t" x="61" y="346" text-anchor="middle" font-size="11" font-weight="700">本音</text>
  <text class="t" x="110" y="333" font-size="11">自分との時間を大切に</text><text class="t" x="110" y="354" font-size="11">してほしかった</text>
  <rect class="card" x="28" y="392" width="334" height="78" rx="15"/>
  <rect class="label2" x="28" y="392" width="66" height="78" rx="15"/>
  <text class="t" x="61" y="434" text-anchor="middle" font-size="11" font-weight="700">背景</text>
  <text class="t" x="110" y="421" font-size="11">最近、二人で話す時間が</text><text class="t" x="110" y="442" font-size="11">減っていた</text>
  <rect class="card" x="28" y="480" width="334" height="78" rx="15"/>
  <rect class="label1" x="28" y="480" width="66" height="78" rx="15"/>
  <text class="t" x="61" y="522" text-anchor="middle" font-size="11" font-weight="700">望み</text>
  <text class="t" x="110" y="509" font-size="11">話すときは少しだけ</text><text class="t" x="110" y="530" font-size="11">こちらを見てほしい</text>
  <text class="t" x="28" y="590" font-size="13" font-weight="700">判断した理由</text>
  <rect class="card" x="28" y="606" width="334" height="68" rx="14"/>
  <text class="t" x="46" y="635" font-size="11">今は気持ちが強いので、少し落ち着いてから</text><text class="t" x="46" y="656" font-size="11">考えたい。</text>
  <rect class="danger" x="28" y="720" width="334" height="54" rx="15"/>
  <text x="195" y="754" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#C96F60" font-weight="700">このメモを削除</text>
</svg>
