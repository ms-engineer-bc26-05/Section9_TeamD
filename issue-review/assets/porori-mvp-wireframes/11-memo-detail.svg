<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>保存メモ詳細画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.card{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.3}.label1{fill:#F2DDD6}.label2{fill:#E3E7D8}.danger{fill:#FFFDFC;stroke:#C96F60;stroke-width:1.5}</style>
  <text class="t" x="26" y="50" font-size="21">‹</text>
  <text class="t" x="195" y="51" text-anchor="middle" font-size="17" font-weight="700">整理メモ</text>
  <text class="m" x="340" y="51" text-anchor="end" font-size="11">2026.09.19</text>
  <rect x="28" y="82" width="90" height="30" rx="15" fill="#F3E8DD"/>
  <text class="t" x="73" y="102" text-anchor="middle" font-size="11">今は保留</text>
  <rect class="card" x="28" y="137" width="334" height="88" rx="15"/>
  <rect class="label1" x="28" y="137" width="66" height="88" rx="15"/>
  <text class="t" x="61" y="185" text-anchor="middle" font-size="11" font-weight="700">出来事</text>
  <text class="t" x="110" y="177" font-size="11">話しているとき、相手が</text><text class="t" x="110" y="198" font-size="11">スマホを見ていた</text>
  <rect class="card" x="28" y="237" width="334" height="88" rx="15"/>
  <rect class="label2" x="28" y="237" width="66" height="88" rx="15"/>
  <text class="t" x="61" y="285" text-anchor="middle" font-size="11" font-weight="700">感情</text>
  <text class="t" x="110" y="277" font-size="11">寂しい、大切にされて</text><text class="t" x="110" y="298" font-size="11">いないように感じた</text>
  <rect class="card" x="28" y="337" width="334" height="88" rx="15"/>
  <rect class="label1" x="28" y="337" width="66" height="88" rx="15"/>
  <text class="t" x="61" y="385" text-anchor="middle" font-size="11" font-weight="700">本音</text>
  <text class="t" x="110" y="377" font-size="11">自分との時間を大切に</text><text class="t" x="110" y="398" font-size="11">してほしかった</text>
  <rect class="card" x="28" y="437" width="334" height="88" rx="15"/>
  <rect class="label2" x="28" y="437" width="66" height="88" rx="15"/>
  <text class="t" x="61" y="485" text-anchor="middle" font-size="11" font-weight="700">望み</text>
  <text class="t" x="110" y="477" font-size="11">話すときは少しだけ</text><text class="t" x="110" y="498" font-size="11">こちらを見てほしい</text>
  <text class="t" x="28" y="574" font-size="13" font-weight="700">判断した理由</text>
  <rect class="card" x="28" y="590" width="334" height="72" rx="14"/>
  <text class="t" x="46" y="621" font-size="11">今は気持ちが強いので、少し落ち着いてから</text><text class="t" x="46" y="642" font-size="11">考えたい。</text>
  <rect class="danger" x="28" y="705" width="334" height="54" rx="15"/>
  <text x="195" y="739" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#C96F60" font-weight="700">このメモを削除</text>
</svg>
