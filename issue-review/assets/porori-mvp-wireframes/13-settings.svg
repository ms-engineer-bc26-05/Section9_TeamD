<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>設定・退会画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.card{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.3}.danger{fill:#FFFDFC;stroke:#C96F60;stroke-width:1.5}</style>
  <text class="t" x="26" y="50" font-size="21">‹</text>
  <text class="t" x="195" y="51" text-anchor="middle" font-size="17" font-weight="700">設定</text>
  <text class="m" x="28" y="100" font-size="12">アカウント</text>
  <rect class="card" x="28" y="116" width="334" height="132" rx="18"/>
  <text class="t" x="48" y="154" font-size="13">登録メールアドレス</text>
  <text class="m" x="48" y="180" font-size="12">me••••@example.com</text>
  <line x1="48" y1="202" x2="342" y2="202" stroke="#E5DED7"/>
  <text class="t" x="48" y="230" font-size="13">ログアウト</text>
  <text class="m" x="336" y="230" text-anchor="end" font-size="16">›</text>
  <text class="m" x="28" y="292" font-size="12">安心して使うために</text>
  <rect class="card" x="28" y="308" width="334" height="156" rx="18"/>
  <text class="t" x="48" y="348" font-size="13">プライバシーについて</text><text class="m" x="336" y="348" text-anchor="end" font-size="16">›</text>
  <line x1="48" y1="373" x2="342" y2="373" stroke="#E5DED7"/>
  <text class="t" x="48" y="407" font-size="13">利用上の注意・相談窓口</text><text class="m" x="336" y="407" text-anchor="end" font-size="16">›</text>
  <line x1="48" y1="432" x2="342" y2="432" stroke="#E5DED7"/>
  <text class="t" x="48" y="452" font-size="13">プランを確認</text><text class="m" x="336" y="452" text-anchor="end" font-size="16">›</text>
  <text class="m" x="28" y="526" font-size="12">退会</text>
  <rect class="danger" x="28" y="542" width="334" height="58" rx="16"/>
  <text x="195" y="578" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#C96F60" font-weight="700">退会手続きへ</text>
  <rect x="28" y="624" width="334" height="102" rx="16" fill="#F2DDD6"/>
  <text class="t" x="48" y="656" font-size="12" font-weight="700">退会すると</text>
  <text class="m" x="48" y="682" font-size="11">保存した整理メモを含む関連データを削除します。</text>
  <text class="m" x="48" y="704" font-size="11">確認画面を表示してから実行します。</text>
</svg>
