<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>AIとの段階的な対話画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.bubble{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.5}.user{fill:#F2DDD6}.input{fill:#FFFFFF;stroke:#D8D0C8;stroke-width:1.5}</style>
  <text class="t" x="26" y="50" font-size="21">‹</text>
  <text class="t" x="195" y="51" text-anchor="middle" font-size="16" font-weight="700">気持ちを整理する</text>
  <text class="m" x="355" y="51" text-anchor="end" font-size="11">中断</text>
  <g font-family="sans-serif" font-size="10" fill="#81766F">
    <circle cx="59" cy="94" r="8" fill="#D98978"/><text x="59" y="120" text-anchor="middle">出来事</text>
    <line x1="67" y1="94" x2="123" y2="94" stroke="#D8D0C8" stroke-width="3"/>
    <circle cx="131" cy="94" r="8" fill="#D98978"/><text x="131" y="120" text-anchor="middle">感情</text>
    <line x1="139" y1="94" x2="195" y2="94" stroke="#D98978" stroke-width="3"/>
    <circle cx="203" cy="94" r="8" fill="#D98978"/><text x="203" y="120" text-anchor="middle">本音</text>
    <line x1="211" y1="94" x2="267" y2="94" stroke="#D8D0C8" stroke-width="3"/>
    <circle cx="275" cy="94" r="8" fill="#E5DED7"/><text x="275" y="120" text-anchor="middle">望み</text>
  </g>
  <rect class="bubble" x="26" y="155" width="300" height="122" rx="18"/>
  <text class="t" x="44" y="186" font-size="13">「寂しい」「置いていかれた感じ」が</text>
  <text class="t" x="44" y="209" font-size="13">あったのですね。</text>
  <text class="t" x="44" y="243" font-size="13">違っているところはありますか？</text>
  <rect class="user" x="144" y="305" width="220" height="62" rx="18"/>
  <text class="t" x="164" y="342" font-size="13">その表現で合っています。</text>
  <rect class="bubble" x="26" y="397" width="300" height="140" rx="18"/>
  <text class="t" x="44" y="429" font-size="13">その寂しさの奥には、相手に本当は</text>
  <text class="t" x="44" y="452" font-size="13">どうしてほしかったという気持ちが</text>
  <text class="t" x="44" y="475" font-size="13">ありそうですか？</text>
  <text class="m" x="44" y="510" font-size="11">思いつく範囲で大丈夫です</text>
  <rect class="input" x="20" y="690" width="350" height="66" rx="20"/>
  <text class="m" x="40" y="730" font-size="13">ここに入力してください</text>
  <circle cx="337" cy="723" r="20" fill="#D98978"/>
  <path d="M329 723h16M339 716l7 7-7 7" fill="none" stroke="#FFF" stroke-width="2"/>
  <text class="m" x="195" y="793" text-anchor="middle" font-size="10">専門窓口・利用上の注意</text>
</svg>
