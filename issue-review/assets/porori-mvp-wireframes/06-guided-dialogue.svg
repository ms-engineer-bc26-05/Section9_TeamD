<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>AIとの段階的な対話画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.bubble{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.5}.user{fill:#F2DDD6}.input{fill:#FFFFFF;stroke:#D8D0C8;stroke-width:1.5}</style>
  <text class="t" x="26" y="50" font-size="21">‹</text>
  <text class="t" x="195" y="51" text-anchor="middle" font-size="16" font-weight="700">気持ちを整理する</text>
  <text class="m" x="355" y="51" text-anchor="end" font-size="11">中断</text>
  <g font-family="sans-serif" font-size="10" fill="#81766F">
    <circle cx="43" cy="94" r="8" fill="#D98978"/><text x="43" y="120" text-anchor="middle">出来事</text>
    <line x1="51" y1="94" x2="107" y2="94" stroke="#D8D0C8" stroke-width="3"/>
    <circle cx="115" cy="94" r="8" fill="#D98978"/><text x="115" y="120" text-anchor="middle">感情</text>
    <line x1="123" y1="94" x2="179" y2="94" stroke="#D98978" stroke-width="3"/>
    <circle cx="187" cy="94" r="8" fill="#D98978"/><text x="187" y="120" text-anchor="middle">本音</text>
    <line x1="195" y1="94" x2="251" y2="94" stroke="#D8D0C8" stroke-width="3"/>
    <circle cx="259" cy="94" r="8" fill="#E5DED7"/><text x="259" y="120" text-anchor="middle">背景</text>
    <line x1="267" y1="94" x2="323" y2="94" stroke="#D8D0C8" stroke-width="3"/>
    <circle cx="331" cy="94" r="8" fill="#E5DED7"/><text x="331" y="120" text-anchor="middle">望み</text>
  </g>
  <rect class="bubble" x="26" y="155" width="300" height="122" rx="18"/>
  <text class="t" x="44" y="186" font-size="13">選んだ気持ちは「寂しい」ですね。</text>
  <text class="t" x="44" y="220" font-size="13">その寂しさの奥で、あなた自身が</text>
  <text class="t" x="44" y="243" font-size="13">大切にしたかったことは何ですか？</text>
  <rect class="user" x="144" y="305" width="220" height="62" rx="18"/>
  <text class="t" x="164" y="330" font-size="13">自分との時間を大切に</text>
  <text class="t" x="164" y="352" font-size="13">したい気持ちです。</text>
  <rect class="bubble" x="26" y="397" width="300" height="140" rx="18"/>
  <text class="t" x="44" y="429" font-size="13">そう感じた理由につながる、大切に</text>
  <text class="t" x="44" y="452" font-size="13">していることや経験はありますか？</text>
  <text class="m" x="44" y="488" font-size="11">相手の意図ではなく、あなた自身のことを</text>
  <text class="m" x="44" y="510" font-size="11">思いつく範囲で教えてください</text>
  <rect class="bubble" x="110" y="637" width="170" height="40" rx="20"/>
  <text class="m" x="195" y="662" text-anchor="middle" font-size="11">まだ分からない</text>
  <rect class="input" x="20" y="690" width="350" height="66" rx="20"/>
  <text class="t" x="40" y="716" font-size="11" font-weight="700">あなたの言葉で答えてください</text>
  <text class="m" x="40" y="738" font-size="13">短くても大丈夫です</text>
  <circle cx="337" cy="723" r="20" fill="#D98978"/>
  <path d="M329 723h16M339 716l7 7-7 7" fill="none" stroke="#FFF" stroke-width="2"/>
  <text class="m" x="195" y="793" text-anchor="middle" font-size="10">相談窓口・利用上の注意</text>
</svg>
