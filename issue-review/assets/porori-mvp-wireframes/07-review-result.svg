<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>整理結果の確認・編集画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.card{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.3}.btn{fill:#D98978}.label1{fill:#F2DDD6}.label2{fill:#E3E7D8}</style>
  <text class="t" x="26" y="50" font-size="21">‹</text>
  <text class="t" x="195" y="51" text-anchor="middle" font-size="17" font-weight="700">整理結果を確認</text>
  <text class="m" x="195" y="81" text-anchor="middle" font-size="11">違うところは編集できます</text>
  <rect class="card" x="24" y="102" width="342" height="78" rx="16"/>
  <rect class="label1" x="24" y="102" width="70" height="78" rx="16"/>
  <text class="t" x="59" y="145" text-anchor="middle" font-size="12" font-weight="700">出来事</text>
  <text class="t" x="109" y="130" font-size="12">話しているとき、相手が</text><text class="t" x="109" y="152" font-size="12">スマホを見ていた</text><text class="m" x="340" y="168" text-anchor="end" font-size="11">編集</text>
  <rect class="card" x="24" y="190" width="342" height="78" rx="16"/>
  <rect class="label2" x="24" y="190" width="70" height="78" rx="16"/>
  <text class="t" x="59" y="233" text-anchor="middle" font-size="12" font-weight="700">感情</text>
  <text class="t" x="109" y="218" font-size="12">寂しい、大切にされて</text><text class="t" x="109" y="240" font-size="12">いないように感じた</text><text class="m" x="340" y="256" text-anchor="end" font-size="11">編集</text>
  <rect class="card" x="24" y="278" width="342" height="78" rx="16"/>
  <rect class="label1" x="24" y="278" width="70" height="78" rx="16"/>
  <text class="t" x="59" y="321" text-anchor="middle" font-size="12" font-weight="700">本音</text>
  <text class="t" x="109" y="306" font-size="12">自分との時間を大切に</text><text class="t" x="109" y="328" font-size="12">してほしかった</text><text class="m" x="340" y="344" text-anchor="end" font-size="11">編集</text>
  <rect class="card" x="24" y="366" width="342" height="78" rx="16"/>
  <rect class="label2" x="24" y="366" width="70" height="78" rx="16"/>
  <text class="t" x="59" y="409" text-anchor="middle" font-size="12" font-weight="700">背景</text>
  <text class="t" x="109" y="394" font-size="12">最近、二人で話す時間が</text><text class="t" x="109" y="416" font-size="12">減っていた</text><text class="m" x="340" y="432" text-anchor="end" font-size="11">編集</text>
  <rect class="card" x="24" y="454" width="342" height="78" rx="16"/>
  <rect class="label1" x="24" y="454" width="70" height="78" rx="16"/>
  <text class="t" x="59" y="497" text-anchor="middle" font-size="12" font-weight="700">望み</text>
  <text class="t" x="109" y="482" font-size="12">話すときは少しだけ</text><text class="t" x="109" y="504" font-size="12">こちらを見てほしい</text><text class="m" x="340" y="520" text-anchor="end" font-size="11">編集</text>
  <rect class="btn" x="24" y="565" width="342" height="58" rx="16"/>
  <text x="195" y="601" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#FFF" font-weight="700">この内容で合っています</text>
  <text class="m" x="195" y="657" text-anchor="middle" font-size="11">背景が分からない場合は空欄でも進めます</text>
  <text class="m" x="195" y="682" text-anchor="middle" font-size="11">承認するまで保存されません</text>
</svg>
