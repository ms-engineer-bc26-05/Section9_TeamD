<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>扱い方の選択画面のワイヤーフレーム</title>
  <rect width="390" height="844" fill="#F7F3EE"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#493E38}.m{fill:#81766F}.card{fill:#FFFDFC;stroke:#D8D0C8;stroke-width:1.5}.btn{fill:#D98978}.soft1{fill:#F2DDD6}.soft2{fill:#E3E7D8}</style>
  <text class="t" x="26" y="50" font-size="21">‹</text>
  <text class="m" x="355" y="50" text-anchor="end" font-size="11">中断</text>
  <text class="t" x="195" y="126" text-anchor="middle" font-size="23" font-weight="700">この気持ちを、</text>
  <text class="t" x="195" y="158" text-anchor="middle" font-size="23" font-weight="700">今どう扱いたいですか？</text>
  <text class="m" x="195" y="192" text-anchor="middle" font-size="12">今の時点での気持ちで大丈夫です</text>
  <rect class="card" x="28" y="240" width="334" height="112" rx="20"/>
  <circle cx="67" cy="282" r="18" class="soft1"/>
  <text class="t" x="98" y="280" font-size="17" font-weight="700">伝える</text>
  <text class="m" x="98" y="308" font-size="12">相手に自分の気持ちを伝えたい</text>
  <rect class="card" x="28" y="372" width="334" height="112" rx="20"/>
  <circle cx="67" cy="414" r="18" fill="#F3E8DD"/>
  <text class="t" x="98" y="412" font-size="17" font-weight="700">今は保留する</text>
  <text class="m" x="98" y="440" font-size="12">今すぐ決めず、いったん置いておきたい</text>
  <rect class="card" x="28" y="504" width="334" height="112" rx="20"/>
  <circle cx="67" cy="546" r="18" class="soft2"/>
  <text class="t" x="98" y="544" font-size="17" font-weight="700">伝えない</text>
  <text class="m" x="98" y="572" font-size="12">伝えないことを自分で選びたい</text>
  <text class="m" x="195" y="676" text-anchor="middle" font-size="11">どの選択も間違いではありません</text>
  <text class="m" x="195" y="701" text-anchor="middle" font-size="11">後から気持ちが変わっても大丈夫です</text>
</svg>
