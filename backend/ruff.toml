# Ruff（Formatter・Lint）の設定。決定の経緯は Issue #46 を参照
line-length = 100
target-version = "py312"

[lint]
# E4・E7・E9・F：Ruffの標準のルール
# I：importの並び順（isort相当）
# B：バグにつながりやすい書き方（flake8-bugbear相当）
select = ["E4", "E7", "E9", "F", "I", "B"]

[lint.flake8-bugbear]
# B008（引数の既定値での関数呼び出し）の対象外にする関数。
# 既存コードでは、FastAPIの依存注入・パラメーター宣言を既定値に書いているため、FastAPIの関数だけを許可する。
# それ以外の関数の呼び出しは、引き続きB008で検出する
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]
