name: porori-encryption-spike

services:
  tests:
    build: .
    environment:
      DATABASE_URL: postgresql://spike@db:5432/spike
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spike
      POSTGRES_DB: spike
      # 外部公開しない、架空データ専用の検証環境限定
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "spike", "-d", "spike"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

networks:
  default:
    internal: true